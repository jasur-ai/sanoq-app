<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f8" />
    <meta name="description" content="Namoz sanoqlarini sodda, chiroyli va oflayn yuriting." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Sanoq — Namoz hisoblagichi</title>
    <style>@keyframes sanoq-spin{to{transform:rotate(360deg)}}</style>
  </head>
  <body>
    <div id="root">
      <div id="boot-screen" style="min-height:100vh;display:grid;place-items:center;background:#f6f7f8;color:#163a35;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center">
          <div style="width:58px;height:58px;display:grid;place-items:center;border-radius:18px;color:#fff;background:linear-gradient(145deg,#1d9776,#09634f);font-size:25px;box-shadow:0 10px 24px rgba(16,125,98,.22)">✦</div>
          <strong style="font-size:22px;letter-spacing:-.04em">Sanoq</strong>
          <div style="display:flex;align-items:center;gap:8px;color:#78918b;font-size:12px"><span style="width:14px;height:14px;border:2px solid #b8d9cf;border-top-color:#137b63;border-radius:50%;animation:sanoq-spin .7s linear infinite"></span> Yuklanmoqda...</div>
        </div>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        var root = document.getElementById('root');
        if (root && document.getElementById('boot-screen')) {
          root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f7f8;color:#163a35;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><div style="width:min(100%,360px);padding:28px;border:1px solid #e6eeeb;border-radius:22px;background:#fff;text-align:center;box-shadow:0 18px 45px rgba(19,67,57,.08)"><div style="font-size:32px;margin-bottom:12px">!</div><h1 style="font-size:19px;margin:0 0 9px">Ilova yuklanmadi</h1><p style="margin:0;color:#78918b;font-size:12px;line-height:1.6">Qayta urinib ko‘ring. Muammo davom etsa, ilovani yopib qayta oching.</p><button onclick="location.reload()" style="margin-top:20px;min-height:42px;padding:0 18px;border:0;border-radius:10px;color:#fff;background:#137b63;font-weight:700">Qayta yuklash</button></div></div>';
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
